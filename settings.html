<div id="auto-retry-settings" class="auto-retry-settings extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>自动重试</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="auto-retry-mode" role="radiogroup" aria-label="自动重试模式">
                <input id="auto-retry-disabled" type="radio" name="auto-retry-mode" value="disabled">
                <label for="auto-retry-disabled">不启用</label>

                <input id="auto-retry-specific" type="radio" name="auto-retry-mode" value="specific">
                <label for="auto-retry-specific">特定报错与空回</label>

                <input id="auto-retry-all" type="radio" name="auto-retry-mode" value="all">
                <label for="auto-retry-all">全部情况</label>
            </div>

            <div class="auto-retry-content">
                <label class="checkbox_label" for="auto-retry-content-enabled">
                    <input id="auto-retry-content-enabled" type="checkbox">
                    <span>启用最后一条 AI 回复的内容重试</span>
                </label>
                <label for="auto-retry-content-delay">内容判断延迟（秒）</label>
                <input id="auto-retry-content-delay" class="text_pole" type="number" min="0" max="3600" step="0.1" inputmode="decimal">
                <small>生成调用结束并完成收尾后，等待指定时间再判断最新回复。默认 0 秒，可设 0–3600 秒；0 表示不额外等待。</small>
                <label for="auto-retry-content-rules">关键词 / 正则（每行一条，任意命中）</label>
                <textarea id="auto-retry-content-rules" class="text_pole" rows="5" placeholder="抱歉，我无法&#10;无法完成请求&#10;/sorry|cannot comply/i"></textarea>
                <small>普通关键词区分大小写；正则格式为 /表达式/flags。无效正则会提示并跳过。</small>
                <div id="auto-retry-content-errors" role="status" aria-live="polite"></div>
                <label for="auto-retry-min-length">回复长度少于此值时重试（0 关闭）</label>
                <input id="auto-retry-min-length" class="text_pole" type="number" min="0" max="1000000" step="1">
                <small>关键词、正则、长度条件为“或”。按正文 Unicode 码点计数，包含空格与换行。总模式“不启用”时不生效。内容重试目前适用于单角色聊天。</small>
            </div>
            <div class="auto-retry-fields">
                <label for="auto-retry-rpm">
                    <span>最高重试 RPM</span>
                    <input id="auto-retry-rpm" class="text_pole" type="number" min="1" step="1" inputmode="numeric">
                </label>
                <label for="auto-retry-count">
                    <span>最高单次重试次数</span>
                    <input id="auto-retry-count" class="text_pole" type="number" min="1" step="1" inputmode="numeric">
                </label>
            </div>
        </div>
    </div>
</div>
